<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form</title>
</head>

<body>

    <h4>Registration Form </h4>
    <form action="actio.php">
        <label for="fname">First name:</label><br>
        <input type="text" id="fname" placeholder="First name" name="fname"><br>
        <label for="lname">Last name:</label><br>
        <input type="text" id="lname" placeholder="Last name" name="lname"><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" placeholder="Email" name="email"><br>
        <label for="password">Password:</label><br>
        <input type="password" id="password" placeholder="Password" name="password">
        <h5> Select Class:</h5>
        <label for="101">
            <input type="radio" value="class XI" name="class" id="101"> Class XI <br>
        </label><br>
        <label for="102">
            <input type="radio" value="class XII" name="class" id="102"> Class XII<br>
        </label>
        <h5> Select Favourite Subjects:</h5>
        <label for="math">
            <input type="checkbox" value="math" name="subjects" id="math"> Maths<br>
        </label>
        <label for="phy">
            <input type="checkbox" value="phy" name="subjects" id="phy"> Physic<br>
        </label>
        <label for="chy">
            <input type="checkbox" value="chy" name="subjects" id="chy"> Chemistry<br>
        </label>
        <label for="Bio">
            <input type="checkbox" value="Bio" name="subjects" id="Bio"> Biology<br>
        </label><br>
        <!--Select Option-->
        Select City:
        <select name="city" id="city">
            <option value="Rawalpindi">Rawalpindi</option>
            <option value="Bannu">Bannu</option>
            <option value="Karak">Karak</option>
            <option value="Kohat">Kohat</option>
        </select><br><br>
        <!-- Feedback textarea -->
        <textarea name="Feedback" placeholder="Write your feedback here..." rows="10" cols="30"></textarea><br><br>
        <input type="submit" value="Submit">
    </form>
</body>

</html>
