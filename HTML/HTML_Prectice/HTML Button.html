<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Button</title>
    <style>
        .testbtn {
            background-color: #04AA6D;
            color: white;
            padding: 12px;
            font-size: 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .testbtn:hover {
            background-color: #091735;
        }
    </style>
</head>

<body>
    <h1>HTML Buttons</h1>

    <p>This is a basic HTML button. It can be clicked, but it will not do anything until you add an action to it.</p>
    <button>Click Me!</button>

    <h4>Styling a Button:</h4>
    <button class="testbtn">Green Button </button>
    <h1>HTML Buttons</h1>

    <!--Disabled Button-->
    <p>A disabled button is unclickable:</p>
    <button disabled>Disabled Button</button>
</body>
