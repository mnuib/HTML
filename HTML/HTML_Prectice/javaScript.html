<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript can change attributes:</title>
</head>

<body>
    <h1>My First JavaScript</h1>
    <p>Here, a JavaScript changes the value of the src (source) attribute of an image.</p>

    <!---JavaScript can change attributes:-->

    <img id="myImage" src="https://www.w3schools.com/html/pic_bulboff.gif" width="100" height="180">

    <p>
        <button type="button" onclick="light(1)">Light On</button>
        <button type="button" onclick="light(0)">Light Off</button>
    </p>
    <p id="demo"></p>

    <script>
        document.getElementById("demo").innerHTML = "Hello JavaScript!";
    </script>

    <noscript>Sorry, your browser does not support JavaScript!</noscript>

    <p>A browser without support for JavaScript will show the text written inside the noscript element.</p>

    <script>
        function light() {
            var image = document.getElementById('myImage');
            if (image.src.match("bulbon")) {
                image.src = "https://www.w3schools.com/html/pic_bulboff.gif";
            } else {
                image.src = "https://www.w3schools.com/html/pic_bulbon.gif";
            }
        }
    </script>

</body>

</html>
