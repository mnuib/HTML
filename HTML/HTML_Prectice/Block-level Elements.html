<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block-level Elements</title>
</head>

<body>
    <p style="border: 1px solid black">Hello World</p>
    <div style="border: 1px solid black">Hello World</div>
    <div>I am Munib From Bannu</div>
    <p style="border: 3px solid red;">I am From Kpk</p>
    <div style="border: 3px solid blue;">My son Name is Muhammad Hammad</div>

    <p>The P and the DIV elements are both block elements, and they will always start on a new line and take up the full
        width available (stretches out to the left and right as far as it can).</p>
</body>

</html>
