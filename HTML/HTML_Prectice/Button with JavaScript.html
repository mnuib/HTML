<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button with JavaScript</title>
</head>

<body>
    <h1>HTML Buttons</h1>

    <p>The button uses the <code>onclick</code> attribute to run JavaScript. When you click the button, it shows an
        alert message.</p>
        <button onclick="alert('Hello!')">Click Me!</button>
</body>

</html>
